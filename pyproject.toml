[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boardproof"
version = "0.2.0"
description = "Hardware design CI: EasyEDA Pro netlist, reviewed constraints, and firmware cross-checks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="BoardProof Contributors"}]
dependencies = []

[project.optional-dependencies]
ai = ["google-genai>=1.20"]
dev = ["pytest>=7"]

[project.scripts]
boardproof = "boardproof.cli:main"

[tool.setuptools.packages.find]
include = ["boardproof*"]
